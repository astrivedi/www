- date: "Sep 2026"
  featured: true
  text: 'Received the <strong>2026 Outstanding Faculty Research Advisor/Mentor Award</strong> from CU Boulder’s College of Engineering and Applied Science.'

- date: "Jun 2026"
  featured: true
  text: 'Launched the three-course <a href="https://www.coursera.org/specializations/foundations-reinforcement-learning">Foundations of Reinforcement Learning Specialization</a> through CU Boulder and Coursera, covering classical RL, deep RL, and reward programming.'

- date: "Jun 2026"
  featured: true
  text: 'Our paper <a href="https://arxiv.org/abs/2511.09363">BarrierBench: Evaluating Large Language Models for Safety Verification in Dynamical Systems</a> appeared at L4DC 2026. It introduces a benchmark of 100 dynamical systems and an LLM-agentic framework for barrier-certificate synthesis.'

- date: "Apr 2026"
  featured: true
  text: '<a href="https://iclr.cc/virtual/2026/poster/10011821">Towards Persistent Noise-Tolerant Active Learning of Regular Languages with Class Query</a>, with Lekai Chen and Alvaro Velasquez, appeared at ICLR 2026. The paper introduces CAPAL for active automata learning under persistent noise.'

- date: "Mar 2026"
  text: '<a href="https://arxiv.org/abs/2505.15693">Average Reward Reinforcement Learning for Omega-Regular and Mean-Payoff Objectives</a> appeared in JAIR, with Milad Kazemi, Mateo Perez, Fabio Somenzi, Sadegh Soudjani, and Alvaro Velasquez.'

